# Expected observations specified in traceability/CONTRACT-SPECIFICATION.md §2,
# independent of implementation output. Commit markers of the contract are SM wire
# messages and are not compared at the application level (assert / update / retract, view, decision).
# low_power_excluded = "위험/제외(exclude)"; stop_suspect = "flag_stopped". No flag = no evidence (보류), not safe.
scenario: CT7-cfg1
calls:
  e1: {manager1: [[assert, RobotStatus, biped1, {battery: 25, zone: storage}]]}
  e2: {manager1: [[retract, RobotStatus, biped1, null]]}
  e3: {manager1: [[assert, RobotStopped, wheel1, {elapsedSeconds: 300}]]}
decisions:
  t1: {biped1: [low_power_excluded], hum1: [], wheel1: []}
  t2: {biped1: [], hum1: [], wheel1: []}
  t3: {biped1: [], hum1: [], wheel1: [stop_suspect]}
