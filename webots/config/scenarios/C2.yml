a: {initial: initial-all}
consumers: [manager1]
reporters: [location]
limit_sim_s: 60
steps:
- {id: m1, move: {task: pass, robot: wheel1, path: [[-9, 0], [-1.5, 0], [1.5, 0], [9, 0]]}}
