role: NonBipedWatch
subscribe:
- (rule (fact (RobotLocatedAt $robot $node)) (= $robot "diff1") (= $node "hold_s") --> (notify (RobotLocatedAt $robot $node)))
- (rule (fact (RobotLocatedAt $robot $node)) (= $robot "wheel1") (= $node "hold_s") --> (notify (RobotLocatedAt $robot $node)))
- (rule (fact (RobotLocatedAt $robot $node)) (= $robot "wheeled1") (= $node "hold_s") --> (notify (RobotLocatedAt $robot $node)))
