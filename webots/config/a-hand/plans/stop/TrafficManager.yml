role: TrafficManager
subscribe:
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "biped1") (>= $elapsedSeconds 3) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "hum1") (>= $elapsedSeconds 3) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "humanoid1") (>= $elapsedSeconds 3) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "hybrid1") (>= $elapsedSeconds 3) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "diff1") (>= $elapsedSeconds 5) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "hybrid1") (>= $elapsedSeconds 5) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "wheel1") (>= $elapsedSeconds 5) --> (notify (RobotStopped $robot $elapsedSeconds)))
- (rule (fact (RobotStopped $robot $elapsedSeconds)) (= $robot "wheeled1") (>= $elapsedSeconds 5) --> (notify (RobotStopped $robot $elapsedSeconds)))
