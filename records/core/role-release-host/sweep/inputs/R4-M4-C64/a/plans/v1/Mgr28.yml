role: Mgr28
subscribe:
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r001") (<= $battery 2) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r003") (<= $battery 2) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r002") (<= $battery -8) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r004") (<= $battery -8) --> (notify (RobotStatus $robot $battery $zone)))
