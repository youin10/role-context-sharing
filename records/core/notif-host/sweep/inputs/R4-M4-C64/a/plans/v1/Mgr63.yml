role: Mgr63
subscribe:
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r001") (<= $battery -33) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r003") (<= $battery -33) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r002") (<= $battery -43) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r004") (<= $battery -43) --> (notify (RobotStatus $robot $battery $zone)))
