- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r002") (<= $battery -17) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r004") (<= $battery -17) --> (notify (RobotStatus $robot $battery $zone)))
