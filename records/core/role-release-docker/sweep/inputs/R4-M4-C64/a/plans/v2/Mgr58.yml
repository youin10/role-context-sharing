role: Mgr58
subscribe:
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r001") (<= $battery -28) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r003") (<= $battery -28) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r002") (<= $battery -28) --> (notify (RobotStatus $robot $battery $zone)))
- (rule (fact (RobotStatus $robot $battery $zone)) (= $robot "r004") (<= $battery -28) --> (notify (RobotStatus $robot $battery $zone)))
